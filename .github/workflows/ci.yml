name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @kobling/web build
  latex:
    # Akseptanse: hvert eksempeldokument kompilerer med latexmk uten feil.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-pictures texlive-science texlive-lang-european latexmk smbclient samba zstd
      - run: pnpm install --frozen-lockfile
      - run: node tools/compile-examples.mjs
      - name: SMB-backup mot ekte Samba
        run: |
          sudo mkdir -p /srv/nas/backup && sudo chmod 777 /srv/nas/backup
          printf '[global]\n  server min protocol = SMB2_10\n[backup]\n  path = /srv/nas/backup\n  read only = no\n  valid users = kobling\n' | sudo tee /etc/samba/smb.conf
          sudo useradd -M -s /usr/sbin/nologin kobling
          printf 'ci-pass1\nci-pass1\n' | sudo smbpasswd -s -a kobling
          sudo systemctl restart smbd
          SMB_USER=kobling SMB_PASS=ci-pass1 node tools/smb-backup-test.mjs
  image:
    if: github.ref == 'refs/heads/main'
    needs: [test, latex]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: ghcr.io/sebastiankristo/kobling-server:latest }
