name: Mobil
# Bygger mobilappen (apps/mobile, Capacitor rundt web-appen): Android .apk og iOS .ipa.
# Ved push bygges begge som artefakter; med en tagg (fra Desktop-workflowen eller manuelt)
# legges filene i GitHub Release for taggen.
#
# Android signeres med nøkkelen i hemmelighetene ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS og ANDROID_KEY_PASSWORD. Uten dem brukes debug-nøkkelen (kan installeres, men
# en ny versjon må da installeres etter at den gamle er fjernet).
# iOS-filen er usignert: signer den med egen Apple-ID (AltStore, Sideloadly) for å installere.
on:
  push:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagg for releasen (f.eks. v0.3.0). Tom = bare artefakter.'
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kobling/web build
      - name: Versjon
        run: |
          echo "V=$(node -p "process.env.TAG ? process.env.TAG.replace(/^v/, '') : require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Signeringsnøkkel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/kobling.jks"
            echo "KOBLING_KEYSTORE=$RUNNER_TEMP/kobling.jks" >> "$GITHUB_ENV"
          fi
      - name: Bygg APK
        working-directory: apps/mobile/android
        env:
          KOBLING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOBLING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOBLING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PkoblingVersion="$V"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kobling_${V}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: 'Kobling_*.apk' }
      - if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Kobling_*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kobling/web build
      - name: Versjon
        run: |
          echo "V=$(node -p "process.env.TAG ? process.env.TAG.replace(/^v/, '') : require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
      - run: npx cap sync ios
        working-directory: apps/mobile
      - name: Bygg IPA (usignert)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Kobling_${V}.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: 'Kobling_*.ipa' }
      - if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Kobling_*.ipa
