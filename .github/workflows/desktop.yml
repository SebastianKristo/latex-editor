name: Desktop
# Bygger Kobling for macOS (.dmg, universal: Apple Silicon + Intel) og Windows (.msi)
# og legger filene i en GitHub Release for taggen. Start med:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagg for releasen (f.eks. v0.1.0)'
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri -> target }
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Kobling ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop-appen for Kobling. Koble til din egen Kobling-server ved første oppstart.

            **macOS:** last ned `Kobling_*_universal.dmg`, åpne den og dra Kobling til Programmer.
            Appen er ikke signert ennå: høyreklikk Kobling i Programmer › Åpne første gang
            (eller `xattr -dr com.apple.quarantine /Applications/Kobling.app`).

            **Windows:** last ned `Kobling_*_x64_en-US.msi` og kjør den. SmartScreen kan advare fordi appen ikke er signert: Mer info › Kjør likevel.
          releaseDraft: false
          prerelease: false
